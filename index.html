<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daisy Dreams – Premium Bouquets & Fresh Flower Delivery</title>
    <meta
      name="description"
      content="Shop beautifully handcrafted bouquets made with fresh flowers at Daisy Dreams for birthdays, anniversaries, celebrations and every special moment."
    />
    <meta
      name="keywords"
      content="daisy dreams, flower delivery, bouquet delivery, fresh flower bouquet, birthday bouquet, anniversary flowers, romantic bouquet, flower delivery near me"
    />
    <meta property="og:title" content="Daisy Dreams – Premium Bouquets & Flower Delivery" />
    <meta
      property="og:description"
      content="Shop beautifully handcrafted bouquets made with fresh flowers at Daisy Dreams for birthdays, anniversaries, celebrations and every special moment."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daisy Dreams" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daisy Dreams – Premium Bouquets & Flower Delivery" />
    <meta
      name="twitter:description"
      content="Shop beautifully handcrafted bouquets made with fresh flowers at Daisy Dreams for birthdays, anniversaries, celebrations and every special moment."
    />
    
    <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org JSON-LD Structured Data for Florist & E-Commerce -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Florist",
        "name": "Daisy Dreams",
        "description": "Handcrafted luxury bouquets and floral arrangements delivered fresh with same-day delivery service by Daisy Dreams.",
        "currenciesAccepted": "INR",
        "paymentAccepted": "Cash, Credit Card, Debit Card, UPI, Net Banking",
        "priceRange": "₹₹",
        "openingHours": "Mo-Su 08:00-21:00",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Bouquets & Flowers",
          "itemListElement": [
            {
              "@type": "OfferCatalog",
              "name": "Featured Bouquets",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Product",
                    "name": "Classic Rose Bouquet",
                    "description": "Velvety handpicked Ecuadorian roses with eucalyptus."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Product",
                    "name": "Forever Love",
                    "description": "Romantic crimson roses, blush spray carnations, and waxflowers."
                  }
                }
              ]
            }
          ]
        }
      }
    </script>
  </head>
  <body class="bg-[#F8F5ED] text-[#18231D] antialiased selection:bg-[#2F6B4F] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
